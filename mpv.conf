#################################################################
# mpv.conf - cleaned 2026-10-23 (redundant default lines removed, Live-Stream URL match fixed); tier fixes 2026-10-23
# 2026-10-24: in-memory cache, per-file interlace latch script, Live-Stream excluded from 4K profiles;
#             single ownership of HDR hint / motion / audio-delay, lighter clean-1080p deband, music + cover-art exclusions
# Rig: RTX 5070 Ti, gpu-next + Vulkan + nvdec, LG G5 77" OLED, Windows HDR calibrated to 2150 nits
# How the auto profiles work: each applies when its condition becomes true and is restored (profile-restore) when it turns false.
# There is no ranking of "winning" profiles, so each contested option has exactly one owner:
#   target-colorspace-hint     -> global no + HDR-Output yes (PQ/HLG source, any resolution). SDR sources do not enable source-driven
#                                 HDR signaling here; actual output/composition behavior depends on the Windows HDR path.
#   interpolation / video-sync / tscale -> global no / audio (24p movies) + HFR-Motion-Stabilizer (local/non-live, progressive >30 fps)
#                                 OR Live-Motion (live URL, progressive); mutually exclusive by condition
#   audio-delay                -> global -0.120 (headphone lip-sync) + music profile 0
#   deinterlace                -> Interlaced-Deint-Lock only
# Deband is the one layered option: the base resolution profile sets a default and a tier profile may override deband-* only.
#   mpv evaluates auto profiles in reverse declaration order, so a tier declared above its base is applied after it. Every base and tier
#   profile writes all five deband fields explicitly (SD writes deband=no plus inert defaults). This layering,
#   including playlist transitions between tiers, was validated on this mpv build (2026-10-24); re-test after mpv upgrades.
# Resolution profiles (all skip cover art / images and Live-Stream URLs):
#   4K    w>=3000 or h>=2000  -> Profile-Native-4K-Shield: HDR output (renderer tone/gamut mapping to target-peak 2150), bilinear,
#                                light deband, fruit dither, no shaders. Also matches SDR 4K (same scaling; SDR sources do not enable HDR signaling)
#   1080  w>=1400 or h>=1000  -> HD-Legacy-Cleaner: ewa_lanczossharp + FSRCNNX, light deband 1/32/16 grain 0, ordered dither
#   SD/720 (smaller)          -> Retro-SD-Upscaler-Core: bilinear only, no dither, no shaders, deband off - min glitter
# Bitrates below are average total-file bitrate (file-size * 8 / duration, so audio, subs and container overhead count): a rough heuristic.
# Movie tiers (release tag + average total-file bitrate; skipped for TV paths):
#   1080: HD-Premium = remux/r00t/FraMeSToR/WRATH or >=15 Mbps; HD-Weak = YTS/YIFY/GalaxyRG/RARBG/PSA/Pahe under 8 Mbps, or any <3.5 Mbps
#   4K:   Profile-4K-Weak = not remux/r00t/FraMeSToR/WRATH and (YTS/YIFY/GalaxyRG/Upscaled, or <10 Mbps, or Tigole/QxR-member tag under 11 Mbps;
#         tag = delimited word: preceded by space [ ( -, followed by ) ] or .ext at end of path, e.g. (Tigole) -Tigole.mkv  Tigole.mkv)
#   Premium tags are ignored inside extras folders (Featurettes, Extras, Deleted Scenes, Behind the Scenes, Interviews, Trailers,
#   Shorts, Specials, Special Features), so extras are tiered by their own bitrate, not by the movie folder's release tag.
# TV tiers (any path folder starting with "tv series", e.g. \TV Series\ or \TV Series 4K\; average total-file bitrate only, tags ignored):
#   TV-HD-Premium >=15 Mbps, TV-HD-Weak <3.5 Mbps, TV-4K-Weak <10 Mbps, TV-SD-Weak 720-class <0.5 / SD <1.0 Mbps
# Other auto profiles:
#   HDR-Output: any PQ/HLG source (4K, 1080p, 720p, SD, HDR streams) -> target-colorspace-hint=yes. SDR sources do not enable
#     source-driven HDR signaling here; actual output/composition behavior depends on the Windows HDR path.
#   HFR-Motion-Stabilizer: progressive >30 fps, not Live-Stream, not music files, not cover art -> interpolation + display-resample
#   Interlaced-Deint-Lock and the HFR interlaced check share a per-file latch (user-data/ilace, set by scripts/interlace-latch.lua),
#     so deint stays on and HFR stays off for the whole file; the latch resets on every new file
#   music files (WASAPI, ReplayGain, gapless, audio-delay 0), auto-fullscreen-video
#   Live-Stream: matched by URL only (http/https path ending .m3u8 / .mpd / .ts, or followed by ?query/#fragment), not by actual
#     liveness, so on-demand manifests match too. ewa + ArtCNN/Krig/adaptive-sharpen, cache/reconnect, picture boost
#   Live-Motion: same URL test, progressive only (skips the interlace latch) -> display-resample + interpolation
# Keys: 7 = Cinema-Night (neutral reset: brightness/contrast/saturation/gamma 0)   8 = Cinema-Day (mild lift: gamma 3, brightness 1, contrast/saturation 0)   (input.conf)
#       Ctrl+S = SDR screenshot of HDR frame (scripts/sdr-screenshot.lua)
# Audio: volume 80, exclusive off, stereo downmix + speechnorm, delay -120 ms (Sony XM5 lip-sync; music profile resets it to 0)
# Save as: %APPDATA%\mpv\mpv.conf
#################################################################

save-position-on-quit=yes
resume-playback=yes
watch-later-options=start

screenshot-format=png
screenshot-directory="~~desktop/"

keep-open=yes
script-opts=osc-layout=box,osc-seekbarstyle=bar
idle=once

alang=en,eng,english
sid=no
slang=en,eng

#log-file="~~desktop/mpv.log"   # uncomment to debug which profile fired
msg-level=all=warn,cplayer=info,vo=info

vo=gpu-next
gpu-api=vulkan
hwdec=nvdec
fbo-format=rgba16f
gpu-shader-cache-dir="~~/shader-cache"


# --- Dither: fruit (Oct 11 Black Hawk Down banding fix). 1080p uses ordered, SD none ---
dither=fruit
# Deband off globally (HDR skies can glitter). Resolution / tier profiles enable their own deband.
deband=no

# Base scaling: bilinear (min glitter). 1080p profile overrides with ewa + FSRCNNX.
scale=bilinear
cscale=spline36
dscale=bilinear

# HDR: map real content peaks, not 4000-nit mastering metadata
# target-colorspace-hint: off by default (SDR sources do not enable source-driven HDR signaling; actual output depends on the Windows HDR path).
# HDR-Output (PQ/HLG sources) is the only profile that turns it on
target-colorspace-hint=no
target-peak=2150
hdr-compute-peak=yes
hdr-peak-percentile=99.995
tone-mapping=spline
gamut-mapping-mode=perceptual

# Motion default (24p movies etc.): only HFR-Motion-Stabilizer or Live-Motion (never both) change these
interpolation=no
video-sync=audio

volume=80
audio-channels=stereo
audio-stream-silence=yes
audio-delay=-0.120
af="lavfi=[speechnorm=e=1.6:r=0.0005:l=1,alimiter=limit=0.89:level=disabled]"

sub-font-size=48
sub-color="0.85/0.85/0.9"
sub-border-size=2
sub-shadow-offset=1

# Cache: in-memory (no disk cache) for 4K remuxes over a network share (60-80 GB files, up to ~100 Mbps).
# 1 GiB forward (~80 s at 100 Mbps, minutes at typical bitrates) + 256 MiB back-buffer for short rewinds; Live-Stream sets its own.
cache=yes
cache-on-disk=no
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB
cache-secs=300
demuxer-hysteresis-secs=0

[Cinema-Night]
profile-desc="7 Night / director - no lift"
gamma=0
brightness=0
contrast=0
saturation=0

[Cinema-Day]
profile-desc="8 Day lift (mild)"
gamma=3
brightness=1
contrast=0
saturation=0

# Interlaced-Deint-Lock: latched per file by scripts/interlace-latch.lua (sets user-data/ilace). Once any frame of the current file
# is flagged interlaced it stays on for that file and is reset on the next start-file; a plain interlaced check flips off as soon as
# deinterlacing makes the output progressive, which toggled deint on and off.
[Interlaced-Deint-Lock]
profile-restore=copy-equal
profile-cond=p["user-data/ilace"] == true
deinterlace=yes

# HDR-Output: sole owner of target-colorspace-hint=yes. Any PQ/HLG source at any resolution (4K, 1080p, 720p, SD, HDR streams)
# gets HDR output. SDR sources keep the global target-colorspace-hint=no, so they do not enable source-driven HDR signaling here;
# actual output/composition behavior depends on the Windows HDR path. No resolution profile writes this option.
[HDR-Output]
profile-restore=copy-equal
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and (p["video-params/gamma"] == 'pq' or p["video-params/gamma"] == 'hlg')
profile-desc="HDR (PQ/HLG) source at any resolution: HDR output (colorspace hint on)"
target-colorspace-hint=yes

# HFR >30 fps, progressive only: the only profile besides Live-Motion that writes interpolation / video-sync / tscale, and it skips
# Live-Stream URLs (which Live-Motion requires), so the two never overlap. Also skips interlaced files (latch), music files and cover art. Applies at every resolution.
# Interpolation here is temporal blending to smooth frame-rate / refresh cadence, not motion-compensated frame generation.
[HFR-Motion-Stabilizer]
profile-restore=copy-equal
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["container-fps"] ~= nil and p["container-fps"] > 30 and not (p["user-data/ilace"] == true) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and not ((function(x) return x:match('%.flac$') or x:match('%.wav$') or x:match('%.alac$') or x:match('%.m4a$') or x:match('%.ape$') or x:match('%.dsf$') end)(string.lower(get('path',''))))
interpolation=yes
video-sync=display-resample
tscale=mitchell

# TV tiers (path contains a folder starting with 'tv series', e.g. \TV Series\ or \TV Series 4K\): decided by average total-file bitrate only, release tags ignored; movie Premium/Weak skip TV paths.
#   4K: <10 Mbps TV-4K-Weak, else plain Native-4K-Shield
#   HD: >=15 Mbps TV-HD-Premium, <3.5 Mbps TV-HD-Weak, else HD-Legacy-Cleaner
#   SD/720 (Retro-SD bucket): TV-SD-Weak if <0.5 Mbps (720-class, h 700-999) or <1.0 Mbps (SD), else plain Retro-SD
#   TV profiles only write deband-*; each is declared above its base profile so it is applied after it (see header).
[TV-HD-Premium]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and (p["video-params/w"] >= 1400 or p["video-params/h"] >= 1000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(sz, dur) return sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) >= 15000000 end)(get('file-size', 0), get('duration', 0))
profile-desc="TV 1080p high bitrate (>=15 Mbps): light deband so grain stays"
profile-restore=copy-equal
deband=yes
deband-iterations=1
deband-threshold=22
deband-range=16
deband-grain=0

[TV-HD-Weak]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and (p["video-params/w"] >= 1400 or p["video-params/h"] >= 1000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(sz, dur) return sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 3500000 end)(get('file-size', 0), get('duration', 0))
profile-desc="TV 1080p low bitrate (<3.5 Mbps): stronger deband + grain"
profile-restore=copy-equal
deband=yes
deband-iterations=4
deband-threshold=52
deband-range=20
deband-grain=10

# 1080p tiers (deband-* only; declared above HD-Legacy-Cleaner so they are applied after it - see header).
#   Premium tags are ignored for files inside extras folders (Featurettes*, Extras, Deleted Scenes*, Behind the Scenes*, Interviews*, Trailers*, Shorts, Specials, Special Features*), so extras fall through to the bitrate rules.
#   HD-Premium: remux / r00t / FraMeSToR / WRATH (tag match: -wrath at end of name, wrath) or wrath], or its x265-E tag), or average total-file bitrate >= 15 Mbps -> lighter deband, keep grain
#   HD-Legacy-Cleaner (default): QxR/Tigole, scene x264, WEB -> light deband 1/32/16
#   HD-Weak (never if premium): YTS / YIFY / GalaxyRG / RARBG / PSA / Pahe tag AND average total-file bitrate < 8 Mbps, or any < 3.5 Mbps -> stronger deband + added grain (masks blocking, cannot restore detail)
[HD-Premium]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and (p["video-params/w"] >= 1400 or p["video-params/h"] >= 1000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and not (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(x, sz, dur) if (((x:find('remux') or x:find('r00t') or x:find('framestor') or x:find('%-wrath[^%w]') or x:find('%-wrath$') or x:find('wrath[%)%]]') or x:find('x265%-e[^%w]') or x:find('x265%-e$')) and not (x:find('[\\/]featurette') or x:find('[\\/]extras[\\/]') or x:find('[\\/]deleted scenes') or x:find('[\\/]behind the scenes') or x:find('[\\/]interviews') or x:find('[\\/]trailers') or x:find('[\\/]shorts[\\/]') or x:find('[\\/]specials[\\/]') or x:find('[\\/]special features')))) then return true end return (sz ~= nil and dur ~= nil and sz > 0 and dur > 0) and (sz * 8 / dur) >= 15000000 end)(string.lower(get('path','')), get('file-size', 0), get('duration', 0))
profile-desc="1080p premium (remux / top encoders): light deband so film grain stays"
profile-restore=copy-equal
deband=yes
deband-iterations=1
deband-threshold=22
deband-range=16
deband-grain=0

[HD-Weak]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and (p["video-params/w"] >= 1400 or p["video-params/h"] >= 1000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and not (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(x, sz, dur) if (((x:find('remux') or x:find('r00t') or x:find('framestor') or x:find('%-wrath[^%w]') or x:find('%-wrath$') or x:find('wrath[%)%]]') or x:find('x265%-e[^%w]') or x:find('x265%-e$')) and not (x:find('[\\/]featurette') or x:find('[\\/]extras[\\/]') or x:find('[\\/]deleted scenes') or x:find('[\\/]behind the scenes') or x:find('[\\/]interviews') or x:find('[\\/]trailers') or x:find('[\\/]shorts[\\/]') or x:find('[\\/]specials[\\/]') or x:find('[\\/]special features')))) or ((sz ~= nil and dur ~= nil and sz > 0 and dur > 0) and (sz * 8 / dur) >= 15000000) then return false end local br = (sz ~= nil and dur ~= nil and sz > 0 and dur > 0) and (sz * 8 / dur) or nil if br == nil then return false end if (x:find('yts') or x:find('yify') or x:find('galaxyrg') or x:find('rarbg') or x:find('pahe') or x:find('[^%w]psa[^%w]') or x:find('[^%w]psa$')) and br < 8000000 then return true end return br < 3500000 end)(string.lower(get('path','')), get('file-size', 0), get('duration', 0))
profile-desc="1080p weak / small public encodes: stronger deband + grain to hide blocking"
profile-restore=copy-equal
deband=yes
deband-iterations=4
deband-threshold=52
deband-range=20
deband-grain=10

[HD-Legacy-Cleaner]
profile-restore=copy-equal
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and (p["video-params/w"] >= 1400 or p["video-params/h"] >= 1000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path',''))))
profile-desc="1080p: ewa + FSRCNNX, light deband"
target-peak=2150
hdr-compute-peak=yes
tone-mapping=spline
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=bilinear
scale-antiring=0.0
cscale-antiring=0.0
# Light deband for clean 1080p (was 3/48/20) so film grain stays; HD-Weak / TV-HD-Weak keep the stronger settings
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=0
dither=ordered
dither-depth=auto
glsl-shaders="~~/shaders/FSRCNNX_x2_16_0_4_1.glsl"
sigmoid-upscaling=yes

# TV-SD-Weak: TV 720-class <0.5 Mbps or SD <1.0 Mbps. Light deband only; Retro-SD scaling kept. Declared above Retro-SD so it is applied after it.
[TV-SD-Weak]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and p["video-params/w"] < 1400 and p["video-params/h"] < 1000 and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and ((p["video-params/h"] >= 700 and (function(sz, dur) return sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 500000 end)(get('file-size', 0), get('duration', 0))) or (p["video-params/h"] < 700 and (function(sz, dur) return sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 1000000 end)(get('file-size', 0), get('duration', 0))))
profile-desc="TV SD/720 very low bitrate: light deband"
profile-restore=copy-equal
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=4

[Retro-SD-Upscaler-Core]
profile-restore=copy-equal
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and p["video-params/w"] < 1400 and p["video-params/h"] < 1000 and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path',''))))
profile-desc="SD: bilinear only - min glitter (no FSRCNNX)"
target-peak=2150
hdr-compute-peak=yes
tone-mapping=spline
# deband off; the other deband fields are written as mpv defaults (inert while off) so a 4K/1080p file earlier in a playlist
# cannot leave its values behind after its profiles restore
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32
scale=bilinear
cscale=bilinear
dscale=bilinear
scale-antiring=0.0
cscale-antiring=0.0
# dither off on purpose: on a 10-bit OLED, dither noise on soft SD sources reads as shimmer, and banding is not the problem there
dither=no
dither-depth=auto
glsl-shaders=

# TV-4K-Weak: TV paths (any folder starting with 'tv series') under 10 Mbps (average total-file bitrate only, tags ignored). 10+ Mbps = plain Native-4K-Shield. Declared above Native so it is applied after it.
[TV-4K-Weak]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(sz, dur) return sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 10000000 end)(get('file-size', 0), get('duration', 0))
profile-desc="TV 4K low bitrate (<10 Mbps): light deband"
profile-restore=copy-equal
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=6

# 4K-Weak: deband-only layer on top of Native-4K-Shield, declared above it so it is applied after it (see header).
# Low-bitrate / re-encoded 4K only:
# not remux/r00t/WRATH/FraMeSToR (all WRATH incl. upscales = premium; tag ignored inside extras folders) AND (YTS/YIFY/GalaxyRG/Upscaled in path OR average total-file bitrate < 10 Mbps OR Tigole/QxR-member tag with bitrate < 11 Mbps)
[Profile-4K-Weak]
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and not (string.find(string.lower(get('path','')), '[\\/]tv series[^\\/]*[\\/]') ~= nil) and (function(x, sz, dur) if p["video-params/w"] == nil or not (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) then return false end if ((x:find('remux') or x:find('r00t') or x:find('framestor') or x:find('%-wrath[^%w]') or x:find('%-wrath$') or x:find('wrath[%)%]]') or x:find('x265%-e[^%w]') or x:find('x265%-e$')) and not (x:find('[\\/]featurette') or x:find('[\\/]extras[\\/]') or x:find('[\\/]deleted scenes') or x:find('[\\/]behind the scenes') or x:find('[\\/]interviews') or x:find('[\\/]trailers') or x:find('[\\/]shorts[\\/]') or x:find('[\\/]specials[\\/]') or x:find('[\\/]special features'))) then return false end if x:find('yts') or x:find('yify') or x:find('galaxyrg') or x:find('upscaled') then return true end if sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 10000000 then return true end if sz ~= nil and dur ~= nil and sz > 0 and dur > 0 and (sz * 8 / dur) < 11000000 then for _, q in ipairs({'tigole','qxr','sampa','silence','afm72','ghost','freethefish','celdra','garshasp','natty','t3nzin','panda','bandi','kappa','prof','monolith','joy','rcvr','hone','langbard','ime','nostradamus'}) do if x:find('[%s%[%(%-]' .. q .. '[%)%]]') or x:find('[%s%[%(%-]' .. q .. '%.%w+$') or x:find('[%s%[%(%-]' .. q .. '$') then return true end end end return false end)(string.lower(get('path','')), get('file-size', 0), get('duration', 0))
profile-desc="4K low-bitrate encode: light deband for banding / blocky shadows"
profile-restore=copy-equal
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=6

[Profile-Native-4K-Shield]
profile-restore=copy-equal
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and p["video-params/w"] ~= nil and (p["video-params/w"] >= 3000 or p["video-params/h"] >= 2000) and not ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path',''))))
profile-desc="4K (HDR or SDR): calm whites, no diamond sky"
scale=bilinear
cscale=spline36
dscale=bilinear
scale-antiring=0.0
cscale-antiring=0.0
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=0
dither=fruit
dither-depth=auto
target-peak=2150
hdr-compute-peak=yes
hdr-peak-percentile=99.995
tone-mapping=spline
gamut-mapping-mode=perceptual
glsl-shaders=


[music]
profile-desc="Auto: lossless/music files - WASAPI shared (not exclusive), cover art, volume 100"
profile-cond=(function(x) return x:match('%.flac$') or x:match('%.wav$') or x:match('%.alac$') or x:match('%.m4a$') or x:match('%.ape$') or x:match('%.dsf$') end)(string.lower(get('path','')))
profile-restore=copy
ao=wasapi
audio-pitch-correction=no
audio-normalize-downmix=no
replaygain=album
replaygain-clip=no
volume=100
volume-max=100
af=
# audio-delay is headphone lip-sync compensation; music has no picture to sync
audio-delay=0
audio-display=embedded-first
force-window=yes
gapless-audio=yes
save-position-on-quit=no

[auto-fullscreen-video]
profile-desc=Fullscreen only when a real video (not music/cover art) is playing
profile-cond=get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false
profile-restore=copy
fs=yes

[Live-Stream]
profile-desc="Live HLS/DASH streams (matched by URL: .m3u8/.mpd/.ts)"
profile-cond=((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path',''))))
profile-restore=copy
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
cache-on-disk=no
cache-secs=20
demuxer-readahead-secs=20
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
stream-lavf-o-append=reconnect=1
stream-lavf-o-append=reconnect_streamed=1
stream-lavf-o-append=reconnect_on_network_error=1
stream-lavf-o-append=reconnect_delay_max=5
hls-bitrate=max
save-position-on-quit=no
resume-playback=no
# Motion lives in Live-Motion (below), so interlaced streams can skip it without making this profile conditional
# Upscaling to 4K
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
scale-antiring=0.6
sigmoid-upscaling=yes
glsl-shaders="~~/shaders/ArtCNN_C4F32_DN.glsl;~~/shaders/KrigBilateral.glsl;~~/shaders/adaptive-sharpen.glsl"
# Clean up stream compression
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=16
dither=ordered
# OLED pop (applies to every matched stream, SDR or HDR; kept by choice)
brightness=2
contrast=3
saturation=6

# Live-Motion: the Live-Stream motion settings, split out so interlaced streams (per-file latch user-data/ilace) skip interpolation.
# Owns interpolation / video-sync / tscale for live URLs. Never overlaps HFR-Motion-Stabilizer, which excludes the same live URLs.
[Live-Motion]
profile-desc="Live URL, progressive: display-resample + temporal interpolation for smoother pans"
profile-cond=(get("current-tracks/video/image", true) == false and get("current-tracks/video/albumart", true) == false) and ((function(u) if not u:match('^https?://') then return false end for _, e in ipairs({'m3u8', 'mpd', 'ts'}) do if u:match('%.' .. e .. '$') or u:match('%.' .. e .. '[?\35]') then return true end end return false end)(string.lower(get('path','')))) and not (p["user-data/ilace"] == true)
profile-restore=copy-equal
video-sync=display-resample
interpolation=yes
tscale=oversample
